name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels keep the torch install small; the tests mock every model.
      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # The 80% coverage gate comes from pytest.ini (--cov-fail-under=80).
      - name: Test
        run: pytest
